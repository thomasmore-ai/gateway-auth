[project]
name = "thomasmore-gateway-auth"
version = "0.1.0"
description = "Shared X-Auth-* wire contract (AuthContext, header constants) for thomasmore.ai services"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thomasmore_gateway_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
